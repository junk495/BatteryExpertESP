<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BatteryExpert</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="update-banner" class="update-banner" hidden>
    <span>Neue Version verfügbar</span>
    <button id="btn-update" class="primary">Neu laden</button>
  </div>

  <header>
    <h1>BatteryExpert</h1>
  </header>

  <main>
    <!-- Live-Dashboard -->
    <section id="view-dashboard" class="view">
      <div id="slots" class="slots"></div>
      <p id="ble-state" class="muted"></p>
    </section>

    <!-- Daten -->
    <section id="view-data" class="view" hidden>
      <section class="card">
        <div class="card-head">
          <h2>Zelltypen</h2>
          <button id="btn-add-type" class="primary">+ Zelltyp</button>
        </div>
        <table>
          <thead><tr>
            <th>Hersteller</th><th>Modell</th><th>Chemie</th>
            <th class="hide-sm">Nennkap.</th><th class="hide-sm">Nennspannung</th><th></th>
          </tr></thead>
          <tbody id="types-body"></tbody>
        </table>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Zellen</h2>
          <button id="btn-add-cell" class="primary">+ Zelle</button>
        </div>
        <table>
          <thead><tr>
            <th>Nr.</th><th>Label</th><th class="hide-sm">Typ</th>
            <th>Status</th><th></th>
          </tr></thead>
          <tbody id="cells-body"></tbody>
        </table>
      </section>

      <section class="card">
        <h2>Historie</h2>
        <table>
          <thead><tr>
            <th>Zeit</th><th>Zelle</th><th>Aktion</th>
            <th>Kapazität</th><th class="hide-sm">Energie</th><th class="hide-sm">Innenwiderstand</th>
          </tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </section>
    </section>

    <!-- Test -->
    <section id="view-test" class="view" hidden>
      <section class="card">
        <h2>Test</h2>
        <p class="muted">Noch nicht verfügbar.</p>
      </section>
    </section>

    <!-- Einstellungen -->
    <section id="view-settings" class="view" hidden>
      <section class="card">
        <div class="card-head">
          <h2>Ladegerät (BLE)</h2>
          <button id="btn-ble-scan" class="primary">Suchen</button>
        </div>
        <p id="settings-ble-state" class="muted">Nicht verbunden</p>
        <div id="settings-devices"></div>
        <button id="btn-ble-disconnect" class="danger" hidden>Trennen</button>
      </section>

      <section class="card">
        <h2>WLAN</h2>
        <label>SSID
          <input id="wifi-ssid" type="text" placeholder="Netzwerkname" autocomplete="off">
        </label>
        <label>Passwort
          <input id="wifi-pass" type="password" placeholder="Passwort" autocomplete="off">
        </label>
        <button id="btn-wifi-save" class="primary">WLAN speichern</button>
        <p id="wifi-status" class="muted">&ndash;</p>
      </section>
    </section>
  </main>

  <nav class="bottom-nav">
    <button data-view="dashboard" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Dashboard</span>
    </button>
    <button data-view="data">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
      <span>Daten</span>
    </button>
    <button data-view="test">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>Test</span>
    </button>
    <button data-view="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      <span>Einstellungen</span>
    </button>
  </nav>

  <!-- Modal: Slot belegen -->
  <div id="slot-modal" class="modal" hidden>
    <div class="modal-box">
      <h2>Slot <span id="slot-modal-num"></span> belegen</h2>
      <label>Zelle
        <select id="slot-modal-cell"></select>
      </label>
      <label>Modus
        <select id="slot-modal-mode"></select>
      </label>
      <div class="modal-actions">
        <button id="slot-modal-cancel">Abbrechen</button>
        <button id="slot-modal-start" class="primary">Starten</button>
      </div>
    </div>
  </div>

  <!-- Modal: Zelle / Zelltyp anlegen oder bearbeiten -->
  <div id="entity-modal" class="modal" hidden>
    <div class="modal-box">
      <h2 id="entity-modal-title"></h2>
      <form id="entity-form"></form>
      <div class="modal-actions">
        <button id="entity-modal-cancel">Abbrechen</button>
        <button id="entity-modal-save" class="primary">Speichern</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/ui.js"></script>
</body>
</html>
