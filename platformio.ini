; PlatformIO Project Configuration
; SkyRC MC5000 BLE -> WiFi Bridge (ESP32-S3)
;
; Environments:
;   esp32s3  - Firmware für das ESP32-S3-DevKitC-1 (N16R8: 16 MB Flash, 8 MB OPI-PSRAM)
;   test     - native Unit-Tests für die reine Protokollschicht (lib/Mc5000Protocol)
;
; Build:    pio run -e esp32s3
; Upload:   pio run -e esp32s3 -t upload
; Tests:    pio test -e test

[platformio]
default_envs = esp32s3

[env]
monitor_speed = 115200

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.memory_type = qio_opi           ; QIO Flash + OPI PSRAM (N16R8)
board_build.arduino.memory_type = qio_opi   ; Fallback (Arduino-Konvention)
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
lib_deps =
    h2zero/NimBLE-Arduino@^2.0.0
    bblanchon/ArduinoJson@^6.21.5

[env:test]
platform = native
test_framework = unity
test_build_src = no
