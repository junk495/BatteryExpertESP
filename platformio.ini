; PlatformIO Project Configuration
; SkyRC MC5000 BLE -> WiFi Bridge (ESP32)
;
; Environments:
;   esp32dev  - Firmware für ein klassisches ESP32 DevKit (Arduino-Framework)
;   test      - native Unit-Tests für die reine Protokollschicht (lib/Mc5000Protocol)
;
; Build:    pio run -e esp32dev
; Upload:   pio run -e esp32dev -t upload
; Tests:    pio test -e test

[platformio]
default_envs = esp32dev

[env]
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino@^2.0.0
    bblanchon/ArduinoJson@^6.21.5

[env:test]
platform = native
test_framework = unity
test_build_src = no
